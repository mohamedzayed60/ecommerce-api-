[project_info]
title = Personal Task Manager API
scenario = Build a RESTful API for managing tasks and categories.
objective = Test student knowledge on Migrations, Eloquent, Routing, and Middleware.

[database_migrations]
table_categories = "id, name, timestamps"
table_tasks = "id, title, description, status, category_id, timestamps"
constraint = "onDelete('cascade') for category_id"

[models_relationships]
task_relationship = "belongsTo Category"
category_relationship = "hasMany Task"
security_rule = "Implement mass assignment protection ($fillable or $guarded)"

[api_routing]
file_path = "routes/api.php"
category_routes = "Full Resourceful CRUD"
task_routes = "Index (with categories), Store, Update Status, Delete"

[controllers]
classes = "CategoryController, TaskController"
response_type = "JSON"
status_codes = "201 Created, 200 OK, 404 Not Found"

[middleware]
class_name = "CheckAdminToken"
logic = "Validate 'Admin-Token' header against 'secret123'"
target_methods = "Apply specifically to delete routes"

[checklist]
step_01 = "Run migrations successfully"
step_02 = "Implement Eager Loading (with('category'))"
step_03 = "Add Request Validation for required fields"
step_04 = "Proper HTTP status code implementation"
step_05 = "Successful testing via Postman/Hoppscotch"

[grading_rubric]
migrations = "Perfect schema (10pts) vs Missing constraints (5pts)"
relationships = "Eloquent standard (10pts) vs Manual logic (5pts)"
middleware = "Functional header check (10pts) vs Not applied (0pts)"
api_standards = "Clean JSON (10pts) vs HTML/Text errors (2pts)"